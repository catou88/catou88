name: Refresh profile cards

on:
  schedule:
    - cron: "17 9 * * *"   # daily, 09:17 UTC
  workflow_dispatch:
  push:
    paths:
      - profile.json
      - scripts/**

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch live stats
        env:
          # Optional: add a repo secret PROFILE_TOKEN (classic PAT, read:user)
          # to include private contributions. Falls back to the built-in token.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_stats.py
      - name: Render SVGs
        run: python3 scripts/gen.py
      - name: Commit
        run: |
          git config user.name "profile-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data
          git diff --cached --quiet || git commit -m "Refresh profile cards"
          git push
